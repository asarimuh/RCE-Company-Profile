<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Rising Creators Entertainment</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/admin/css/admin-base.css" />
  <link rel="stylesheet" href="/admin/css/admin-login.css" />
</head>
<body class="login-body">

  <div class="login-card">

    <div class="login-logo">
      <img src="/public/assets/rce-brand-logo.svg" alt="Rising Creators Entertainment" />
    </div>

    <div class="login-header">
      <span class="login-badge">Admin Portal</span>
      <h1>Selamat Datang</h1>
      <p>Masuk untuk mengakses dashboard internal.</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="login-field">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="admin@risingcreators.id"
          autocomplete="email"
          required
        />
        <span class="login-field__error" id="emailError"></span>
      </div>

      <div class="login-field">
        <label for="password">Password</label>
        <div class="login-field__pass-wrap">
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <button type="button" id="togglePassword" class="login-field__eye" aria-label="Toggle password">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <span class="login-field__error" id="passwordError"></span>
      </div>

      <span class="login-error" id="loginError"></span>

      <button type="submit" class="login-btn" id="loginBtn">
        <span id="loginLabel">Masuk</span>
        <span id="loginSpinner" class="login-spinner" hidden></span>
      </button>
    </form>

  </div>

  <script type="module" src="/admin/js/login.js"></script>
</body>
</html>
