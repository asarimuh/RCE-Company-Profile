<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talent Database — RCE Admin</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/admin/css/admin-base.css" />
  <link rel="stylesheet" href="/admin/css/admin-layout.css" />
  <link rel="stylesheet" href="/admin/css/admin-components.css" />
  <link rel="stylesheet" href="/admin/css/analytics.css" />
</head>
<body>

<div class="admin-app">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__logo">
      <img src="/public/assets/rce-brand-logo.svg" alt="RCE" />
      <span class="admin-sidebar__logo-badge">Admin</span>
    </div>

    <nav class="admin-sidebar__nav">
      <span class="admin-sidebar__section-label">Menu Utama</span>

      <a href="/admin/dashboard.html" class="admin-sidebar__link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
        Dashboard
      </a>

      <a href="/admin/kol-database.html" class="admin-sidebar__link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        KOL / KOC Database
      </a>

      <a href="/admin/talent-database.html" class="admin-sidebar__link active">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M4 20a8 8 0 0 1 16 0"/>
        </svg>
        Talent Database
      </a>

      <a href="/admin/analytics.html" class="admin-sidebar__link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        Analytics
      </a>

      <span class="admin-sidebar__section-label">Segera Hadir</span>

      <span class="admin-sidebar__link admin-sidebar__link--disabled">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/>
        </svg>
        Kolaborasi
        <span class="admin-sidebar__coming-soon">Soon</span>
      </span>
    </nav>

    <div class="admin-sidebar__footer">
      <div class="admin-sidebar__user">
        <div class="admin-sidebar__avatar" id="userAvatar">A</div>
        <div class="admin-sidebar__user-info">
          <div class="admin-sidebar__user-email" id="userEmail">Loading...</div>
        </div>
      </div>
      <button class="admin-sidebar__logout" id="logoutBtn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Keluar
      </button>
    </div>
  </aside>

  <header class="admin-header">
    <div>
      <div class="admin-header__title">Talent Database</div>
      <div class="admin-header__subtitle">Kelola data pendaftar talent</div>
    </div>
    <div class="admin-header__right">
      <span class="admin-header__date" id="headerDate"></span>
    </div>
  </header>

  <main class="admin-main">
    <div class="admin-page-header">
      <h1>Talent Database</h1>
      <p>Semua data pendaftar talent dari form registrasi publik.</p>
    </div>

    <div class="admin-card">
      <div class="admin-toolbar">
        <div class="admin-toolbar__left">
          <div class="admin-search">
            <svg class="admin-search__icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="searchInput" placeholder="Cari nama, email, talent, username..." />
          </div>

          <select class="admin-filter" id="filterStatus">
            <option value="">Semua Status</option>
            <option value="pending">Pending</option>
            <option value="reviewing">Review</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
            <option value="on_hold">On Hold</option>
          </select>

          <select class="admin-filter" id="filterView">
            <option value="all">Semua Data</option>
            <option value="verified">Verified</option>
          </select>
        </div>

        <div class="admin-toolbar__right">
          <button class="btn btn--primary" id="addTalentBtn">Tambah Talent</button>
          <button class="btn btn--ghost" id="exportBtn">Export Excel</button>
          <select class="admin-filter" id="pageSize">
            <option value="10">10 / halaman</option>
            <option value="25">25 / halaman</option>
            <option value="50">50 / halaman</option>
          </select>
        </div>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th class="sortable" data-col="full_name">Nama</th>
              <th class="sortable" data-col="primary_talent">Talent Utama</th>
              <th class="sortable" data-col="city">Kota</th>
              <th>WhatsApp</th>
              <th>Email</th>
              <th>Social</th>
              <th class="sortable" data-col="verification_status">Status</th>
              <th class="sortable" data-col="created_at">Tanggal</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div class="admin-pagination">
        <div id="paginationInfo" class="admin-pagination__info"></div>
        <div id="paginationControls" class="admin-pagination__controls"></div>
      </div>
    </div>
  </main>
</div>

<div id="detailMount"></div>

<script type="module" src="/admin/js/admin-theme.js"></script>
<script type="module" src="/admin/js/talent-database.js"></script>
</body>
</html>
